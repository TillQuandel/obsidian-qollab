# Qollab — Registratur der Versuche
#
# WOZU
# Die Frage "haben wir X schon probiert?" war bis zum 2026-08-12 nur zu
# beantworten, indem man drei Dokumente las und hoffte. Genau daran hat das
# Projekt schon einmal verloren: Kandidat A lief bis zum 2026-08-07 als
# "ungemessene Luecke", obwohl er am 2026-07-31 gemessen worden war — "die
# Luecke lag in der Registratur, nicht im Messstand".
#
# Diese Datei ist die SSoT fuer die Versuchslage. `docs/versuche.md` wird daraus
# erzeugt (`node docs/versuche-ansicht.mjs`) und ist nur Lesefassung — nie von
# Hand editieren. `tests/versuche-registratur.test.ts` prueft beides.
#
# DIE FELDER, und warum gerade diese
#
#   verdikt      Die Unterscheidung, auf der dieses Projekt besteht:
#                  gebrochen     — aktiv schlechter oder verletzt ein Kriterium
#                  leergelaufen  — Vorbedingung trat nie ein; Rueckfall aufs
#                                  Bestandsverhalten, KEIN Schaden
#                  eingebaut     — im Produktivcode auf master
#                  offen         — gemessen, aber nicht eingebaut
#                  kein-urteil   — Pruefung nicht zustande gekommen
#                  ueberholt     — durch eine bessere Loesung ersetzt
#                Die Vault-Note besteht ausdruecklich auf gebrochen vs.
#                leergelaufen: "Ein Kandidat, der leerlaeuft, ist etwas anderes
#                als einer, der bricht."
#
#   zellbasis    Nie eine nackte Zahl. Eine frueher zitierte Zahl ("162/400")
#                war eine unbelegte Ableitung.
#
#   beleg_lage   nachlaufbar        — Bericht UND Instrument existieren
#                instrument-weg     — Bericht da, Messung nicht wiederholbar
#                kein-bericht       — nur eine Spur, etwa eine Daily-Note-Zeile
#                Vier Zahlengruppen des Projekts sind heute nicht mehr
#                nachlaufbar, weil ihre Instrumente in geloeschten
#                Job-Verzeichnissen lagen. Das gehoert an den Eintrag, nicht in
#                eine Fussnote.

schema_version: 1
stand: 2026-08-12

# Woraus dieser Bestand gezogen ist — und woraus nicht. Eine Registratur, die
# ihre eigene Reichweite nicht kennt, laedt zu genau dem Fehlschluss ein, den sie
# verhindern soll ("steht nicht drin, also nie probiert").
quellen_ausgewertet:
  - docs/produktziel.md
  - "Vault: CRDT-Erstkontakt-ohne-gemeinsame-Historie.md"
  - obsidian-qollab-doku/sdd/erstkontakt-synthese-2026-08-03.md
  - obsidian-qollab-doku/sdd/spike-report.md
  - README.md
quellen_offen:
  - "obsidian-qollab-doku/sdd/ — 166 Dateien; ausgewertet sind die oben genannten
     plus die aus produktziel.md und der Vault-Note verlinkten. Die
     task-*-report/-review-Reihe ist NICHT systematisch durchgesehen."
  - "Die mess/*-Branches tragen Messlaeufe, die auf master nicht liegen."

versuche:

  # ─── Ebene: Inkarnations-Kennung / Erstkontakt ────────────────────────────
  # Die Kandidatenliste dieser Ebene ist geschlossen. Alle vier gezielten
  # Kandidaten blieben wirkungslos, und zwar aus demselben Grund: Die
  # Verdopplung entsteht eine Ebene tiefer, bei der Materialisierung.

  - id: K-01
    name: Koordination ueber den Sync (Lock, Lease, Fuehrungswahl, Wartefenster)
    ebene: kennung
    hypothese: Ein Verfahren einigt die Geraete darauf, wer die Historie anlegt.
    verdikt: gebrochen
    kennzahl: "Wartefenster drueckt die Fehlerrate bei aktivem Peer auf 0,01 %, bleibt im Rollout-Fall zweistellig"
    zellbasis: Simulation, Zellbasis nicht ueberliefert
    datum: 2026-07-31
    begruendung: >
      Beweisbar unmoeglich: Bis zum Ablauf des Wartefensters ist "der andere
      existiert nicht" von "seine Datei ist noch unterwegs" nicht zu
      unterscheiden, und die Verzoegerung eines Datei-Syncs ist unbeschraenkt.
      Erledigt die ganze Kategorie — Sperren, Leases, Fuehrungswahl.
    beleg: "Vault-Note, Abschnitt 'Koordination ist beweisbar unmoeglich'"
    beleg_lage: instrument-weg

  - id: K-02
    name: clientID konstant setzen
    ebene: kennung
    hypothese: Gleiche Kennung auf beiden Geraeten macht die Ketten kompatibel.
    verdikt: gebrochen
    kennzahl: "344/400 stille Divergenz"
    zellbasis: 400 Laeufe
    datum: 2026-07-31
    begruendung: >
      Bei abweichendem Text divergieren die Geraete still — schlechter als der
      Bestand. Am Produktivcode reproduziert.
    beleg: "Vault-Note, Ausschlusstabelle"
    beleg_lage: nachlaufbar

  - id: K-03
    name: clientID aus dem Texthash
    ebene: kennung
    hypothese: Identitaet aus dem Inhalt statt aus einer Zufallszahl.
    verdikt: gebrochen
    kennzahl: "400/400 dupliziert unter realistischer Sync-Verzoegerung"
    zellbasis: 400 Laeufe
    datum: 2026-07-31
    begruendung: >
      Wirkt nur bei exakt gleichem Text. Setzt die Kennung auf ALLE Ops und
      kollidiert dadurch auch in den Folge-Clocks. Yjs' Autor verbietet
      clientID-Manipulation mehrfach ausdruecklich; es gibt bewusst keine API.
    beleg: "Vault-Note, Ausschlusstabelle"
    beleg_lage: nachlaufbar

  - id: K-04
    name: Update-Bytes direkt bauen
    ebene: kennung
    hypothese: Ein Genesis-Update deterministisch erzeugen, ohne clientID zu setzen.
    verdikt: gebrochen
    kennzahl: "keine — semantisch identisch zu K-03"
    zellbasis: analytisch
    datum: 2026-07-31
    begruendung: >
      Ein Genesis-Update ist eine in der clientID eineindeutige Funktion.
      "Deterministisch ohne Kennungsfestlegung" ist ein Widerspruch in sich.
    beleg: "Vault-Note, Ausschlusstabelle"
    beleg_lage: nachlaufbar

  - id: K-05
    name: Deterministischer Genesis (Zed-Konstruktion)
    ebene: kennung
    hypothese: Ein eingefrorener gemeinsamer Startzustand gibt beiden Ketten denselben Vorfahren.
    verdikt: leergelaufen
    kennzahl: "8.640 Laeufe zahlengleich mit dem Bestand, in jeder Zelle beider Transportmodi"
    zellbasis: 8.640 Laeufe
    datum: 2026-08-03
    begruendung: >
      Die Konstruktion traegt technisch — der Eingriff war aktiv (bit-identische
      Startzustaende 0/720 auf 350/720) — und bewirkt nichts. Struktureller
      Grund: In Qollab treffen zwei gepraegte Ketten nie im selben Y.Doc
      aufeinander; mergeCompatible filtert nach GUID, der Tie-Break-Verlierer
      verwirft seinen Doc und bringt seinen Beitrag als Text-Diff zurueck. Die
      Item-ID-Identitaet hat damit keinen Angriffspunkt. Gilt auch fuer N >= 3.
      Nebenbefund - `new Y.Doc({clientID})` wird stillschweigend ignoriert.
    beleg: "Branch spike/genesis-determinismus, Commit 5cbcbf2; erstkontakt-synthese-2026-08-03.md"
    beleg_lage: nachlaufbar

  - id: K-06
    name: Saat-Kennung (Inkarnationskennung per FNV-1a aus dem Grundtext)
    ebene: kennung
    hypothese: Zwei Geraete mit demselben Grundtext kommen auf dieselbe Kennung — ein hergestellter gemeinsamer Vorfahre.
    verdikt: leergelaufen
    kennzahl: "Vorbedingung 0/24 im Vorabtest, 0/720 je Zelle im Projekt-Harness"
    zellbasis: 24 Laeufe / 720 Zustellordnungen x 8 Zellen
    datum: 2026-08-07
    begruendung: >
      Faellt nicht, weil sie bricht, sondern weil ihre Vorbedingung nie eintritt.
      Der Praegemoment liegt HINTER dem Saattext (main.ts:1346 - der Start-Sweep
      ueberspringt Notizen ohne Hilfsdatei, die Kennung entsteht erst beim ersten
      echten Edit), der Saattext traegt die Kennung also schon, und zwei Menschen
      tippen nicht bytegleich. In allen acht gepaarten Zellen Spalte fuer Spalte
      identisch mit dem Bestand.
    beleg: "Vault-Note, Nachtrag 2026-08-07; erstkontakt-2026-08-07.md"
    beleg_lage: nachlaufbar

  - id: K-07
    name: Kandidat A — Genesis-Blob mit Blob-Hash-Tie-Break
    ebene: kennung
    hypothese: Der Tie-Break entscheidet nach dem Hash des Genesis-Blobs statt nach einer Zufallskennung.
    verdikt: gebrochen
    kennzahl: "Verlust steigt (baselineRace 7 auf 10); Duplikate fallen in keinem Modus (16>16, 23>24, 15>19)"
    zellbasis: 3 Modi x 40 Seeds, alle 120 Zustellreihenfolgen, 7 Mutationsproben
    datum: 2026-07-31
    begruendung: >
      Verfehlt beide Haelften seines eigenen Akzeptanzkriteriums. Der lehrreiche
      Teil - fuenf seiner sechs Konstruktionsbedingungen sind im Bestand bereits
      implementiert; real aendert er nur den Tie-Break-SCHLUESSEL, und der ist
      nicht die tragende Stelle. Wirkt ueber Adoption, nicht ueber Item-ID, ist
      also von K-05 nicht miterledigt und musste einzeln gemessen werden.
    beleg: "spike-report.md §3.4"
    beleg_lage: instrument-weg

  - id: K-08
    name: Note-Kennung zur Historien-Kennung ableiten
    ebene: kennung
    hypothese: Aus dem Notiznamen eine gemeinsame Historien-Kennung gewinnen.
    verdikt: gebrochen
    kennzahl: "Verbesserung bei 2 Geraeten, vollstaendiger Zusammenbruch bei 3"
    zellbasis: nicht ueberliefert
    datum: 2026-07-31
    begruendung: >
      Eine geteilte Identitaet ist keine geteilte Historie. Gleiche Kennungen
      machen alle Ketten kompatibel, also werden ALLE gemergt.
    beleg: "Vault-Note, Ausschlusstabelle"
    beleg_lage: nachlaufbar

  - id: K-09
    name: Bibliothekswechsel (Loro, Automerge, Diamond Types, cola, json-joy, Peritext)
    ebene: kennung
    hypothese: Ein anderes CRDT fuehrt inhaltsgleiche Einfuegungen zusammen.
    verdikt: gebrochen
    kennzahl: "keines der sieben geprueften Systeme fuehrt inhaltsgleiche, unabhaengig erzeugte Einfuegungen zusammen"
    zellbasis: 7 Bibliotheken, an den Primaerquellen geprueft
    datum: 2026-08-04
    begruendung: >
      Identitaet ist ueberall (ReplicaID, Counter), der Merge ist Vereinigung
      ueber Op-IDs, Inhalt wird nie verglichen. Der Yjs-Maintainer in yjs#364 -
      "There is no algorithm (based on CRDTs) that can magically resolve the
      merge to be the expected result ... Even if the insertions contain the same
      content." Loro und Automerge empfehlen selbst den Workaround. Zweitbefund -
      eine feste Geraete-ID als CRDT-Client-ID ist gefaehrlich, nicht hilfreich.
    beleg: "Vault-Note, Abschnitt 'Kein Text-CRDT loest es'; recherche-crdt-2026-08-04.md"
    beleg_lage: nachlaufbar

  - id: K-10
    name: Andere Yjs-Datentypen (Y.Array, Y.Map mit Zeilen-Keys)
    ebene: kennung
    hypothese: Ein anderer Datentyp umgeht das Problem.
    verdikt: gebrochen
    kennzahl: "Y.Array dupliziert gleich"
    zellbasis: analytisch
    datum: 2026-08-04
    begruendung: >
      Y.Map mit inhaltsabgeleiteten Zeilen-Keys macht einseitige Loeschung zum
      Muenzwurf und braucht EBENFALLS einen geteilten Genesis.
    beleg: "Vault-Note, Ausschlusstabelle"
    beleg_lage: nachlaufbar

  - id: K-11
    name: Nachtraegliche Deduplikation, textuell
    ebene: kennung
    hypothese: Das Duplikat hinterher wieder entfernen.
    verdikt: gebrochen
    kennzahl: "konvergent, also stille Korruption"
    zellbasis: nicht ueberliefert
    datum: 2026-07-31
    begruendung: >
      Frisst legitime Wiederholungen und zerlegt Edits im duplizierten Block.
      Konvergent heisst hier - alle Geraete sind sich einig, dass etwas fehlt.
    beleg: "Vault-Note, Ausschlusstabelle"
    beleg_lage: nachlaufbar

  - id: K-12
    name: Nachtraegliche Deduplikation, strukturell
    ebene: kennung
    hypothese: Ueber die CRDT-Struktur statt ueber den Text deduplizieren.
    verdikt: gebrochen
    kennzahl: "88 von 130 Faellen mit Textverlust"
    zellbasis: 130 Faelle an echtem Material
    datum: 2026-07-31
    begruendung: >
      Ignoriert Position und Kontext; Ersetzungs-Edits werden verstuemmelt
      ("status - ongoing>done" ergibt "status - on").
    beleg: "Vault-Note, Ausschlusstabelle"
    beleg_lage: nachlaufbar

  - id: K-13
    name: Kandidat B — basis-basierter Drei-Wege-Merge ohne CRDT
    ebene: architektur
    hypothese: Eine gespeicherte Basis ersetzt das CRDT; gemergt wird gegen sie.
    verdikt: gebrochen
    kennzahl: "B-inhalt 58/120 sauber, B-hash 57/120, B-lokal 3/120 — Bestand 27/120; Verlust steigt in baselineRace"
    zellbasis: 3 Varianten x 120 Zustellreihenfolgen
    datum: 2026-07-31
    begruendung: >
      Verfehlt das Akzeptanzkriterium (Verlust steigt), verdoppelt aber die Zahl
      sauberer Laeufe und beseitigt Nicht-Konvergenz und Nicht-Fixpunkt
      vollstaendig. Zwei harte Grenzen - er braucht eine fuenfte, in der Vorlage
      nicht vorgesehene Zutat, sonst waechst der Text unbegrenzt; und ohne
      gesyncte Hilfsdatei ist er unbrauchbar (B-lokal - 83/120 Explosionen).
      Bricht beim DRITTEN Replikat (Unison-Spezifikation §11). Sync-Scope
      schrumpft von 10,5 MB wachsend auf 0,74 MB konstant.
    beleg: "spike-report.md §2.2, Teil 2; Vault-Note Zeile 'Basis-Drei-Wege-Merge statt CRDT'"
    beleg_lage: instrument-weg

  - id: K-14
    name: Inhaltsadressierter Zustands-Log
    ebene: architektur
    hypothese: Kennung eines Zustands = Hash seines Textes; damit ist jeder je veroeffentlichte Zustand ein Anschlusspunkt.
    verdikt: gebrochen
    kennzahl: "N=2 40/40 Fixpunkt und 0 unverwandte Ketten; N=3 33/40; N=4 nur 9/40"
    zellbasis: 40 Seeds je Zelle
    datum: 2026-08-07
    begruendung: >
      Der einzige Kandidat, der die Bedingung ENTFERNT statt sie zu
      bewirtschaften — und er konvergiert nicht. Bei N=3 Seed 1 waechst der Text
      nach dem letzten Nutzer-Edit von 136 auf 15.208 Zeichen, der Graph von 36
      auf 4.813 Knoten, alles merge-erzeugt. Kernversprechen "0 unverwandte
      Ketten" gilt nur bei N=2. Offenes Loch, ausdruecklich - die
      Nichtkonfluenz ist eine Eigenschaft der spike-eigenen Merge-Funktion, nicht
      zwingend inhaltsadressierter Logs ueberhaupt. Erledigt ist diese Bauart,
      nicht die Idee. Gewinn, der bleibt - 4 statt 35 Dateien je Seed bei N=2.
    beleg: "Vault-Note, Nachtrag 2026-08-07; erstkontakt-synthese-2026-08-03.md"
    beleg_lage: nachlaufbar

  - id: K-15
    name: Rueckzug plus Konfliktkopie
    ebene: kennung
    hypothese: Die unterlegene Seite verwirft ihre Fassung und legt eine Konfliktkopie an — die Empfehlung der Vorbilder.
    verdikt: gebrochen
    kennzahl: "in 0 von 120 Seeds besser als der Bestand; Endtexte in 120/120 identisch"
    zellbasis: 120 Seeds
    datum: 2026-08-02
    begruendung: >
      Der gemessene Verlust (83 Faelle) verschwand nicht durch den Rueckzug,
      sondern stammte vollstaendig AUS der Konfliktkopie. Der praktische Punkt
      dahinter - eine Konfliktkopie gibt es in dieser Umgebung schon ohne Plugin.
      Wer sie als neue Sicherung einbaut, verlegt nur, wer sie erzeugt, und
      verliert dabei den Merge, den das CRDT in denselben Faellen hinbekommen
      haette.
    beleg: "Vault-Note, Nachtrag 2026-08-02 — einzige Spur ist eine Zeile in der Daily Note vom 02.08."
    beleg_lage: kein-bericht

  - id: K-16
    name: Einrichtungsschritt mit Verweigerung (git-annex-Regel)
    ebene: architektur
    hypothese: Ein Geraet initialisiert, die anderen treten bei; unverwandte Historien werden abgelehnt statt gemergt.
    verdikt: offen
    kennzahl: "nicht gemessen"
    zellbasis: —
    datum: 2026-08-03
    begruendung: >
      Verschiebt das Problem - aendert die Koernung des Rennens von vielen
      kleinen (Schaden - eine Notiz) zu einem grossen (Schaden - der ganze
      Vault). Verwertbar nur mit Verweigerung statt Warnung, Vorbild `git merge`,
      das unverwandte Historien standardmaessig ablehnt; Nextcloud hat aus
      demselben Grund von Warnung auf Blockade verschaerft. Bis auf eine
      unentscheidbare Frage pruefbar — die beantwortet ein Mensch, und das ist
      Koordination ausserhalb des Kanals, vom Unmoeglichkeitssatz nicht erfasst.
    beleg: "Vault-Note 'Was bleibt'; erstkontakt-synthese-2026-08-03.md Punkt 4"
    beleg_lage: nachlaufbar

  # ─── Ebene: Materialisierung / Verdopplung ────────────────────────────────
  # Hier liegt der gemessene Hebel: 100 % der Duplikate entstehen dadurch, dass
  # fremder Text als eigene Op verbucht wird. Rund 99 % werden in applyUpdate
  # sichtbar, 81,5 % gehen durch eine einzige Tuer.

  - id: M-01
    name: Zeilenweises Gate an switchToGuid
    ebene: materialisierung
    hypothese: Nur materialisieren, was winnerText nicht schon traegt — der Text steht lokal zur Verfuegung.
    verdikt: gebrochen
    kennzahl: "-0,84 % sichtbare Verdopplung gegen +42 % stillen Grundtextverlust (1.536 auf 2.187 kollabierte Zeilen)"
    zellbasis: 4.000 Seeds, gepaart, identisches Szenario je Arm
    datum: 2026-08-12
    begruendung: >
      Das Gate laesst eine lokale Zeile weg, WEIL der Gewinner-Doc dafuer schon
      ein Item traegt — und aliasiert damit den eigenen Beitrag auf ein fremdes
      Item. Ab da toetet ihn jeder gewoehnliche Delete auf dem Gewinner-Geraet.
      Nutzenmenge und Gefahrenmenge sind identisch - von 3.348 weggelassenen
      Vorkommen war NULL ohne Gewinner-Item, es gibt keine sichere Teilmenge.
      Die Erkenntnis dahinter - die Verdopplung ist nicht Rauschen, sie ist der
      Traeger der lokalen Urheberschaft. Trifft jeden Ansatz dieser Bauart.
    beleg: "docs/produktziel.md; spike/gate-widerlegung/probe-aliasing.mjs"
    beleg_lage: nachlaufbar

  - id: M-02
    name: Lokalen Beitrag als Yjs-Update uebertragen statt materialisieren
    ebene: materialisierung
    hypothese: Statt Text neu zu erzeugen, das Rest-Update der Verlierer-Kette einspielen.
    verdikt: gebrochen
    kennzahl: "1.134 von 1.134 Grundtextzeilen verloren (100 %), 200 von 200 Notizen"
    zellbasis: 200 Notizen, gepaart
    datum: 2026-08-12
    begruendung: >
      Das Rest-Update traegt ein Delete-Set ueber die Item-IDs der
      Verlierer-Kette. Teilen zwei Geraete dieselbe Verlierer-Inkarnation — der
      Normalzustand jedes konvergierten Paars —, loescht das zweite genau die
      Items, die im Gewinner-Doc LEBEN. Konvergent und damit still.
      Der lehrreichste Teil ist, warum das keiner Messung auffiel - der
      Szenariogenerator vergibt je Notiz und Geraet genau einmal eine eigene
      Kennung, alle Verlierer-Ketten sind dort disjunkt. Die Null, die der
      Entwurf gemessen hatte, war eine Eigenschaft des Generators.
    beleg: "docs/produktziel.md, Abschnitt 'Das naheliegende Gate ist gefallen'"
    beleg_lage: nachlaufbar

  - id: M-03
    name: unite selbst aendern
    ebene: materialisierung
    hypothese: Die Vereinigungsfunktion so bauen, dass sie nicht doppelt materialisiert.
    verdikt: kein-urteil
    kennzahl: "keine — Prueflauf technisch gescheitert"
    zellbasis: —
    datum: 2026-08-12
    begruendung: >
      Derselben Bauart wie M-01 und stuende unter demselben Einwand
      (Aliasierung des eigenen Beitrags). Nicht gemessen.
    beleg: "docs/produktziel.md, 'Folge fuer die Kandidatenlage'"
    beleg_lage: nachlaufbar

  - id: M-04
    name: Tuer ensureDoc unterdruecken
    ebene: materialisierung
    hypothese: Eine der drei setContent-Aufrufstellen ist die Quelle der Verdopplung.
    verdikt: gebrochen
    kennzahl: "0 % Wirkung — verdopp bleibt 845, obwohl der Arm 11.950 Zeilen streicht"
    zellbasis: 200 Seeds, DET 42
    datum: 2026-08-12
    begruendung: >
      Kausal inert - was der Adopt-Zweig materialisiert, sammelt der Tie-Break
      ohnehin wieder ein. Methodisch wichtig - der naheliegende Indikator rankt
      diese Tuer mit 87 % auf Platz 1. Erst nach Herausrechnen des Grundtexts
      sagt er das Ergebnis voraus. Ohne die Gegenprobe waere die falsche Tuer
      bearbeitet worden.
    beleg: "spike/verdopplung/aufrufstelle.mjs"
    beleg_lage: nachlaufbar

  - id: M-05
    name: Tuer applyLocalContent unterdruecken
    ebene: materialisierung
    hypothese: wie M-04
    verdikt: gebrochen
    kennzahl: "+23,4 % Verdopplung und +33 % Verlust"
    zellbasis: 200 Seeds, DET 42
    datum: 2026-08-12
    begruendung: Unterdruecken schadet hier aktiv. "Alle drei" kostet Verlust 103 auf 235.
    beleg: "spike/verdopplung/aufrufstelle.mjs"
    beleg_lage: nachlaufbar

  - id: M-06
    name: Herkunftstor schaerfen (Hebel B, istEigen)
    ebene: materialisierung
    hypothese: Ein schaerferes Eigen-Kriterium verhindert, dass eine per Sync gelieferte .md als eigener Edit durchgeht.
    verdikt: offen
    kennzahl: "Textverlust -33 bis -55 % (101 auf 65 bei N=4); loest K.o.-1 aber nur in einer von drei Seed-Familien"
    zellbasis: 200 Seeds x 3 Seed-Familien, N=4, DET 7
    datum: 2026-08-09
    begruendung: >
      Der staerkste ungenutzte Hebel. Zwei Dinge vor einem Einbau zu klaeren -
      im echten Plugin liegt zwischen merke() und istEigen() das
      pathQueue-Fenster (main.ts:302-344), im Messapparat folgt der Vergleich
      synchron, B wuerde real also MEHR Fehlparkungen erzeugen als gemessen. Und
      die Doc-Marke muesste ein Hash sein, kein voller Doc-Text.
    beleg: "docs/produktziel.md, 'Zwei Hebel wurden gebaut und gegeneinander gemessen'"
    beleg_lage: nachlaufbar

  # ─── Ebene: Merge-Verfahren / Textverlust ─────────────────────────────────

  - id: T-01
    name: Fuzzy patch_apply in threeWayMerge (Bestand bis 2026-08-11)
    ebene: merge
    hypothese: —  (gewachsener Bestand, nie als Kandidat geprueft)
    verdikt: ueberholt
    kennzahl: "23 zerstoerte Grundtextzeilen, 1.679 Textverlust, 10.672 Verdopplung"
    zellbasis: 8 Zellen a 200 Seeds x 10 Notizen
    datum: 2026-08-11
    begruendung: >
      patch_apply sucht die Stelle eines Hunks unscharf. 170 bis 385 Mal je Zelle
      findet es eine Stelle, deren Kontext nicht zeichengleich ist, und
      uebersetzt die Op-Indizes — die Ops landen an verschobener Stelle und
      veraendern eine Zeile, die niemand angefasst hat. Ersetzt durch T-04.
    beleg: "docs/produktziel.md; spike/schnitt/ergebnis-patch-*.txt"
    beleg_lage: nachlaufbar

  - id: T-02
    name: Exakte Suche statt Fuzz (kein-fuzz)
    ebene: merge
    hypothese: Den unscharfen Treffer abschalten rettet den Grundtext.
    verdikt: gebrochen
    kennzahl: "Grundtext 23 auf 0, aber Gesamtverlust +35,4 % (1.679 auf 2.274)"
    zellbasis: 8 Zellen a 200 Seeds x 10 Notizen
    datum: 2026-08-11
    begruendung: >
      Bricht den Alltagsfall - threeWayMerge('a','a+Lokal','a+Fremd') legt
      "Lokal" in den Meldeblock statt in den Text. Bei kurzen Texten deckt der
      Patch-Kontext fast alles ab, und der Fuzz gleicht das in der Mehrzahl der
      Faelle KORREKT aus. Zwei Befunde, die die Aktenlage korrigierten - der Fuzz
      verwirft im Bestand nichts (0 von 4.283 Hunks), und der Preis haengt an der
      Notizgroesse, gegenlaeufig zur Erwartung.
    beleg: "docs/produktziel.md, 'Der Preis der exakten Suche'"
    beleg_lage: nachlaufbar

  - id: T-03
    name: Verwurf melden plus dedup
    ebene: merge
    hypothese: Exakt suchen und den verworfenen Hunk sichtbar anhaengen statt ihn zu schlucken.
    verdikt: gebrochen
    kennzahl: "Grundtext 0, Verlust -10,6 %, aber Verdopplung +10,2 %; Einbau in vier Anlaeufen gescheitert"
    zellbasis: 8 Zellen a 200 Seeds; Einbauversuch auf Branch versuch/patch-apply-einbau
    datum: 2026-08-11
    begruendung: >
      Ohne Idempotenz-Pruefung waechst die Meldung (121 auf 186 auf 251 ueber
      drei Runden). Vier Einbauanlaeufe - exakte Suche bricht den Alltagsfall,
      Zeilen-Tokenisierung entschaerft ihn nicht, ein globaler Rueckfall bricht
      die Loeschsemantik, eine Schadenspruefung pro Hunk loest 149 von 150 Tests.
      Wichtiger als die vier Anlaeufe - die Metrik selbst ist blind fuer den
      Unterschied zwischen "einsortiert" und "angehaengt", die
      Entscheidungsvorlage ueberschaetzt den Tausch also.
    beleg: "Branch versuch/patch-apply-einbau, Commit 75235b1 ('FUNKTIONIERT NICHT, nicht mergen')"
    beleg_lage: nachlaufbar

  - id: T-04
    name: Zeilenweiser Drei-Wege-Merge gegen die Basis
    ebene: merge
    hypothese: patch_apply ist fuer den Fall OHNE gemeinsamen Vorfahren gebaut — hier gibt es einen.
    verdikt: eingebaut
    kennzahl: "Grundtext 23 auf 0, Gesamtverlust -18,3 %, Verdopplung -6,5 %, Divergenz 2 auf 1; 566/566 Tests gruen"
    zellbasis: 8 Zellen a 200 Seeds x 10 Notizen; kein Rueckschritt in einer einzigen Zelle
    datum: 2026-08-11
    begruendung: >
      Weil auf ZEILEN gearbeitet wird, kann keine Operation mehr eine fremde
      Zeile aufbrechen — das war die Schadensmechanik des Zeichen-Diffs. Der
      Hinweis stand seit Wochen im eigenen Messapparat. Erledigt auch die drei
      Achsen, an denen der Fix vom 2026-08-10 nicht trug (N >= 5, grosse Notizen,
      mdModus ueberschreiben). Bekannte Grenzen - diff3 ist formal nicht
      idempotent (24,7 % der Faelle, Bestand 100 %), Konvergenz nicht garantiert
      (13,7 % der Merge-Reihenfolgen liefern verschiedene Texte).
    beleg: "Commit efae37a; Wirkungsnachweis an drei echten Obsidian-Instanzen 2026-08-12"
    beleg_lage: nachlaufbar

