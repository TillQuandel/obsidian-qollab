  - id: T-08
    name: Zeilenende-Garantie in threeWayMerge (padLast wie in unionMerge)
    ebene: merge
    hypothese: >
      threeWayMerge klebt zwei Zeilen aneinander, wenn ein Stand nicht auf einem
      Zeilenumbruch endet — der Fall, den unionMerge seit Review C-1 abfaengt.
    verdikt: eingebaut
    kennzahl: "an r13s Textlage 217 auf 191 Zeichen, mB 2 auf 1; r13-cdp danach PASS (15 gruen). Suite 600 auf 608 gruen, kein Rueckschritt. NICHT wirksam bei r14 - siehe X-08"
    zellbasis: zwei Realtest-Laeufe an je zwei echten Obsidian-Instanzen (r13-cdp-lokal, r14-cdp-lokal), 8 neue Unit-Tests, Idempotenz ueber 2000 gepaarte Faelle je Zelle; Wirkung am 2026-08-13 in der vollen Batterie nachgefahren
    datum: 2026-08-13
    begruendung: >
      diff_linesToChars_ tokenisiert INKLUSIVE Zeilenende. zeilenListe schneidet
      eine Schlusszeile ohne \n ohne Trennzeichen ab, dreiWegeZeilen fuegt mit
      join('') zusammen — die naechste Zeile klebt daran fest. unionMerge faengt
      das seit Review C-1 mit padLast ab (text-merge.ts:376-379) und beschreibt
      den Schaden woertlich; beim Wechsel auf den zeilenweisen Merge (T-04) wurde
      dieselbe Behandlung nicht mitgezogen. padLast hatte im ganzen Modul drei
      Aufrufstellen, alle drei in unionMerge.
      Kleinster Fall - threeWayMerge('a\nb','a\nb\nX','a\nb\nY') ergab
      'a\nb\nXb\nY' statt 'a\nb\nX\nY'.
      AM PRODUKT GEMESSEN, nicht konstruiert - beide Runner endeten mit
      'A2-<RunId>BBB-<RunId>' in einer Zeile; in r13 sind beide Vaults
      byte-gleich, also konvergenter und damit STILLER Schaden. Verletzt Gruppe 1
      ("Der Text bleibt strukturell heil"), nicht K.o.-1 - kein Grundtext geht
      verloren.
      Warum es niemand sah - tests/three-way-line-endings.test.ts prueft CRLF, LF
      und BOM, aber alle 26 Fixtures endeten auf einem Zeilenumbruch. Genau der
      Fall, den unionMerges eigener Kommentar "in Obsidian der Normalfall" nennt,
      war fuer threeWayMerge nicht abgedeckt.
      DIE ERSTE FASSUNG DES FIXES WAR SELBST FALSCH und ist von der adversarialen
      Pruefung gefallen. Sie entfernte das angehaengte Zeilenende nur, wenn WEDER
      local NOCH other eines hatte — und las other damit als Beitrag, auch wenn
      other === base, die Gegenseite also gar nichts geaendert hat. Damit brach
      die Identitaet threeWayMerge(base, local, base) === local - der gewoehnliche
      lokale Edit am Dateiende (Obsidian schreibt dort keinen Umbruch) bekam einen
      angehaengt, und sync-handler.ts:1847 schrieb Datei und CRDT-Op fuer eine
      Aenderung, die niemand gemacht hat. Selbstverstaerkend, weil die Datei
      danach auf einem Umbruch endet.
      DIE TRAGENDE FASSUNG mergt das Umbruch-Bit selbst 3-Wege-artig - wer es
      gegenueber base geaendert hat, bestimmt es (zielNl = localNl === baseNl ?
      otherNl : localNl). Beide Richtungen sind als Test gepinnt.
      ZWEITE PRUEFRUNDE, zweiter Fehler - der Strip nahm pauschal EIN Zeichen
      zurueck. `mitNl` ist aber nicht umkehrbar - ein Text ohne Schluss-Umbruch
      und derselbe Text mit einem bilden beide auf dieselbe gepolsterte Fassung ab.
      Endete das Ergebnis auf einer LEERZEILE, loeschte der Strip diese
      Zeile und verfehlte die eigene Zusage trotzdem, weil danach immer noch ein
      Umbruch dastand. Eigene Messung: 481 von 19.959 gemergten Tripeln (2,4 %)
      betroffen - konvergent auf beiden Seiten und damit still. Behoben; ein Text mit leerer Schlusszeile
      kann das Bit `false` gar nicht erfuellen, dort ist Nichtstun richtig.
      DER PREIS, ausdruecklich - die Nicht-Idempotenz beim MEHRFACH-Merge steigt
      in den Ohne-Zeilenende-Zellen: 482 auf 741, 204 auf 751, 648 auf 750 von je
      2000 gepaarten Faellen; die Mit-Zeilenende-Zelle bleibt bei 760 unveraendert.
      Das ist KEIN neues Verhalten, sondern eine Vereinheitlichung auf den Pfad,
      den der Mit-Zeilenende-Fall im Bestand schon nahm: Von den Faellen, in denen
      neu instabil und alt stabil ist, sind 305/305, 604/604 und 291/294 dort schon
      im Bestand instabil. Die drei Reste sind von Hand nachgesehen und ebenfalls
      Vereinheitlichung - eine Schwaeche der automatischen Kontrollfrage, nicht des
      Produkts (Beispiel im Quelltext von idempotenz.mjs).
      diff3 ist formal nicht idempotent (Khanna/Kunal/Pierce, FSTTCS 2007); der
      Fix verschiebt nur, welche Faelle in diesen bekannten Pfad fallen.
      DAS INSTRUMENT WAR SELBST BLIND und ist gehaertet - sein Alphabet enthielt
      keinen Leerstring, und es entfernte per Regex ALLE Schluss-Umbrueche statt
      nur einem - es konnte also nie einen Text mit leerer Schlusszeile erzeugen.
      Genau die Schadensklasse der zweiten
      Runde war damit strukturell unsichtbar, und seine Zahl wurde als Entlastung
      zitiert, die sie fuer diesen Fall nicht trug. Jetzt: 366/2000 der erzeugten
      Texte enden auf einer Leerzeile.
    beleg: "spike/duplikat-mb/zeilenende.mjs und idempotenz.mjs (beide Fassungen gegeneinander); tests/three-way-line-endings.test.ts; obsidian-qollab-doku/sdd/runs/ — r13-lokal-lauf2.log, r14-lokal-lauf.log, suite-nach-t08.log (die 608), idempotenz-t08.log; leerzeile.mjs fuer die 481/19.959"
    beleg_lage: nachlaufbar

